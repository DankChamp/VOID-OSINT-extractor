# VOID OSINT extractor - workspace root
#
# This file is the workspace, not a distribution. Each tool under tools/ has its own
# pyproject.toml and is installed, editable, into the single shared virtual environment
# in .venv/. That keeps one interpreter for the whole repository: tools cannot pin
# conflicting versions of the same library, and `run.py test` / `run.py lint` cover
# everything at once.
#
# Add a tool by creating tools/<name>/pyproject.toml. No change here is required - the
# workspace member glob picks it up.

[project]
name = "void-osint-extractor"
version = "0.1.0"
description = "VOID OSINT extraction tools"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv]
# The workspace root ships no importable code; only its members are installed.
package = false

[tool.uv.workspace]
members = ["tools/*"]

[dependency-groups]
# Shared development tooling. Every tool's test suite runs with this one installation.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tools"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Any warning fails a test; this is what caught the provider socket leak. Deprecation
# warnings from dependencies are exempted because a newer interpreter or a freshly
# resolved dependency set would otherwise fail the suite for reasons unrelated to this
# code, and the suite has to stay runnable on every device.
filterwarnings = [
    "error",
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
]
markers = [
    "integration: tests that require external services (skipped when unavailable)",
]

# ------------------------------------------------------------------ ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN201", "ANN001"]

# ----------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Checked explicitly by run.py lint, which enumerates the installed tools; a glob here
# would also pick up caches and build artefacts.
mypy_path = "tools"

[[tool.mypy.overrides]]
module = ["typer", "typer.*", "yaml"]
ignore_missing_imports = true