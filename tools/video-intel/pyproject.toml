[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-intel"
version = "0.1.0"
description = "Transcript-first, multi-AI knowledge extraction for YouTube videos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VOID OSINT" }]
keywords = ["transcript", "knowledge-extraction", "osint", "youtube", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    # Transcript ingestion. It is imported lazily so the rest of the CLI stays usable
    # without network features, but every real `analyze` run needs it, so it must be a
    # declared dependency rather than something that happens to be installed.
    "youtube-transcript-api>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
video-intel = "video_intel.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/video_intel"]
artifacts = ["src/video_intel/web/index.html"]